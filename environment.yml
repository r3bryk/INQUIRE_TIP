# INQUIRE_TIP - conda environment (tested with Python 3.11.14, Windows 11)
# conda env create -f environment.yml
name: inquire_tip
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.3.3
      - pandas==2.3.3
      - scipy==1.16.3
      - scikit-learn==1.7.2
      - xgboost==3.2.0
      - shap==0.51.0
      - joblib==1.5.2
      - tqdm==4.67.1
      - openpyxl==3.1.5
      - matplotlib==3.10.7
      - ipywidgets==8.1.7
      - jupyterlab==4.4.7
      - ipykernel==6.30.1
